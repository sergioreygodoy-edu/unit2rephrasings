<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>UNIT 2 - BIG WIDE WORLD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--card:#fff;--tx:#0d2a3a;--mu:#4d7487;--bg1:#18e0b4;--bg2:#1e8fff;--bg3:#1a2a9c;--ac:#1e8fff;--ans:#e3fbe9;--ansb:#17a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#0f2433;--tx:#fff;--mu:#a9d0e3;--ans:#0f3a2a;--ansb:#3ee08a}}
:root[data-theme="dark"]{--card:#0f2433;--tx:#fff;--mu:#a9d0e3;--ans:#0f3a2a;--ansb:#3ee08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border-radius:24px;max-width:700px;width:100%;padding:30px 28px;box-sizing:border-box;border-top:10px solid var(--ac);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.cover{text-align:center;padding:60px 28px;background:linear-gradient(135deg,#b6ff4d,#18c9a8 45%,#1e6bff);color:#fff;border-top:none}
.cover h1{font-size:clamp(30px,8vw,52px);line-height:1.08;margin:0 0 34px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.cnt{color:var(--ac);font-size:15px;font-weight:800;margin-bottom:12px}
.bar{height:8px;background:rgba(128,128,160,.25);border-radius:4px;margin-bottom:24px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.s{font-size:clamp(20px,4.5vw,27px);line-height:1.35;margin:0 0 16px;font-weight:600}
.p{display:inline-block;font-weight:800;color:#fff;background:var(--ac);border-radius:999px;padding:6px 20px;font-size:20px;margin-bottom:24px}
.a{background:var(--ans);border-left:6px solid var(--ansb);border-radius:12px;padding:14px 16px;font-size:clamp(18px,4vw,22px);margin-bottom:24px;font-weight:600}
.a[hidden]{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border-radius:14px;padding:12px 22px;cursor:pointer;border:3px solid var(--ac);background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--ac)}
button.w{background:#fff;color:#1e6bff;border-color:#fff}
.sum{max-height:70vh;overflow-y:auto;margin:0 0 20px;padding:0;list-style:none}
.sum li{border-left:6px solid var(--ac);background:rgba(128,160,180,.14);border-radius:10px;padding:10px 14px;margin-bottom:10px;line-height:1.35}
.sum b{color:var(--ac)}.sum em{display:block;font-style:normal;color:var(--ansb);font-weight:700;margin-top:4px}
h2{margin:0 0 16px}
</style></head><body>
<div class="card" id="c"></div>
<script>
const D=[
["Dr. Lee plans to study whales all day tomorrow.","all day","Dr. Lee will be studying whales all day tomorrow."],
["We're going to map the whole seabed on this trip.","by the end of the trip","By the end of the trip, we will have mapped the whole seabed."],
["Our class is going to observe the Moon through telescopes tomorrow evening.","this time tomorrow","This time tomorrow, our class will be observing the Moon through telescopes."],
["Will humans live on Mars one day?","in the future","Will humans be living on Mars in the future?"],
["How many species are scientists going to discover this year?","by the end of the year","How many species will scientists have discovered by the end of the year?"],
["The turtles are going to lay their eggs before sunrise.","by sunrise","By sunrise, the turtles will have laid their eggs."],
["The explorers plan to cross the jungle next month.","this time next month","This time next month, the explorers will be crossing the jungle."],
["Our teacher is probably going to finish the science project before Friday.","by Friday","Our teacher will probably have finished the science project by Friday."],
["Will you finish your biology report tonight?","by the time you go to bed","Will you have finished your biology report by the time you go to bed?"],
["Are the whales going to leave the bay before winter?","by winter","Will the whales have left the bay by winter?"],
["I'm going to look at the stars through my telescope at midnight.","at midnight","At midnight, I will be looking at the stars through my telescope."],
["Astronauts are probably going to build a base on the Moon before 2040.","by 2040","By 2040, astronauts will probably have built a base on the Moon."],
["Climate change is going to melt most of the polar ice before the end of the century.","by the end of the century","By the end of the century, climate change will have melted most of the polar ice."],
["We're going to snorkel with sea turtles on Saturday morning.","this time on Saturday","This time on Saturday, we will be snorkelling with sea turtles."],
["Are robots going to explore the ocean floor in 2070?","in 2070","Will robots be exploring the ocean floor in 2070?"],
["I'm definitely going to read ten wildlife books before the summer.","by the summer","I will definitely have read ten wildlife books by the summer."],
["The crew is probably going to repair the space station's antenna all night.","all night","The crew will probably be repairing the space station's antenna all night."]
];
const cols=['#1e8fff','#00a88f','#7a4cff','#ff7a1a','#e0267d','#2fa84f'];
const c=document.getElementById('c');const N=D.length;
function setC(k){document.documentElement.style.setProperty('--ac',k)}
function cover(){setC('#1e8fff');c.className='card cover';c.innerHTML='<h1>UNIT 2 - BIG WIDE WORLD</h1><button class="w" id="st">Start</button>';st.onclick=()=>show(0)}
function show(i){
 setC(cols[i%cols.length]);c.className='card';
 c.innerHTML=`<div class="cnt">${i+1} / ${N}</div><div class="bar"><i style="width:${(i+1)/N*100}%"></i></div>
 <p class="s">${D[i][0]}</p><div class="p">(${D[i][1]})</div>
 <div class="a" id="a" hidden>${D[i][2]}</div>
 <div class="row"><button class="g" id="b">Back</button><button id="r">Show answer</button><button class="g" id="n">${i==N-1?'All answers':'Next'}</button></div>`;
 b.onclick=()=>i==0?cover():show(i-1);
 r.onclick=()=>{a.hidden=!a.hidden;r.textContent=a.hidden?'Show answer':'Hide answer'};
 n.onclick=()=>i==N-1?summary():show(i+1)}
function summary(){
 setC('#7a4cff');c.className='card';
 c.innerHTML='<h2>All sentences and answers</h2><ol class="sum">'+D.map(d=>`<li>${d[0]} <b>(${d[1]})</b><em>${d[2]}</em></li>`).join('')+'</ol><div class="row"><button class="g" id="b">Back</button><button id="h">Cover</button></div>';
 b.onclick=()=>show(N-1);h.onclick=cover}
cover();
</script></body></html>
